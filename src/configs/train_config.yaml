# ============================================================
# MODEL
# ============================================================

model:
  num_classes: 10
  reg_max: 16
  image_size: 640


# ============================================================
# TRAINING
# ============================================================

training:

  epochs: 50

  batch_size: 8

  num_workers: 4

  seed: 42

  device: "cuda"

  amp: true

  gradient_clip: 10.0


# ============================================================
# OPTIMIZER
# ============================================================

optimizer:

  name: "AdamW"

  learning_rate: 0.001

  weight_decay: 0.0005

  momentum: 0.937


# ============================================================
# SCHEDULER
# ============================================================

scheduler:

  name: "cosine"

  min_lr: 0.00001

  warmup_epochs: 3


# ============================================================
# LOSS
# ============================================================

loss:

  box_weight: 7.5

  cls_weight: 0.5

  dfl_weight: 1.5


# ============================================================
# CHECKPOINT
# ============================================================

checkpoint:

  save_dir: "checkpoints"

  save_best: true

  save_last: true


# ============================================================
# LOGGING
# ============================================================

logging:

  print_frequency: 20

  save_history: true